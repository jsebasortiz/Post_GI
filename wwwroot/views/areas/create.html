<!-- VISTA CREAR ÁREA -->
<div id="viewAreaCreate" class="app-view view-hidden">
  <div style="margin-bottom: 1.5rem;">
    <a href="/areas" class="btn btn-secondary" onclick="navigateTo('/areas'); return false;">
      <i class="fa-solid fa-arrow-left"></i> Volver a Gestión de Áreas
    </a>
  </div>
  <div class="modal-card" style="max-width: 700px; margin: 0 auto; box-shadow: var(--shadow-md);">
    <div class="modal-header">
      <h2><i class="fa-solid fa-folder-plus" style="color:var(--accent-cyan);"></i> Crear Nueva Área</h2>
    </div>
    <div class="modal-body">
      <form id="createAreaForm" onsubmit="handleCreateArea(event)">
        <div class="form-group">
          <label class="form-label" for="areaNombre"><i class="fa-solid fa-tag"></i> Nombre del Área (Categoría
            Principal)</label>
          <input type="text" id="areaNombre" class="form-control" placeholder="Ej: Telecomunicaciones, Finanzas..."
            required>
        </div>
        <div class="form-group">
          <label class="form-label" for="areaDesc"><i class="fa-solid fa-align-left"></i> Descripción (Opcional)</label>
          <textarea id="areaDesc" rows="3" class="form-control" placeholder="Breve descripción del área..."></textarea>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:1rem; margin-top:1.5rem;">
          <a href="/areas" class="btn btn-secondary" onclick="navigateTo('/areas'); return false;">Cancelar</a>
          <button type="submit" class="btn btn-primary" id="btnSaveArea">
            <i class="fa-solid fa-floppy-disk"></i> Guardar Área
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
