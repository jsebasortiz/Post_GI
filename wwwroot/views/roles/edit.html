<!-- VISTA EDITAR ROL -->
<div id="viewRoleEdit" class="app-view view-hidden">
  <div style="margin-bottom: 1.5rem;">
    <a href="/rbac" class="btn btn-secondary" onclick="navigateTo('/rbac'); return false;">
      <i class="fa-solid fa-arrow-left"></i> Volver a Roles y Permisos
    </a>
  </div>
  <div class="modal-card" style="max-width: 700px; margin: 0 auto; box-shadow: var(--shadow-md);">
    <div class="modal-header">
      <h2><i class="fa-solid fa-user-pen" style="color:var(--accent-purple);"></i> Editar Rol</h2>
    </div>
    <div class="modal-body">
      <form id="editRoleForm" onsubmit="handleSaveEditRole(event)">
        <input type="hidden" id="editRoleId">
        <div class="form-group">
          <label class="form-label" for="editRoleNombre"><i class="fa-solid fa-user-gear"></i> Nombre del Rol</label>
          <input type="text" id="editRoleNombre" class="form-control" placeholder="Nombre del rol..." required>
        </div>
        <div class="form-group">
          <label class="form-label" for="editRoleDesc"><i class="fa-solid fa-align-left"></i> Descripción del Rol</label>
          <textarea id="editRoleDesc" rows="3" class="form-control" placeholder="Descripción del rol..."></textarea>
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:1.5rem;">
          <button type="button" class="btn btn-danger" onclick="handleDeleteRoleFromForm()">
            <i class="fa-solid fa-trash-can"></i> Eliminar Rol
          </button>
          <div style="display:flex; gap:1rem;">
            <a href="/rbac" class="btn btn-secondary" onclick="navigateTo('/rbac'); return false;">Cancelar</a>
            <button type="submit" class="btn btn-primary" id="btnSubmitEditRole">
              <i class="fa-solid fa-floppy-disk"></i> Guardar Cambios
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
