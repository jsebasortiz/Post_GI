<!-- VISTA EDITAR TIPO -->
<div id="viewPostTiposEdit" class="app-view view-hidden">
  <div style="margin-bottom: 1.5rem;">
    <a href="/tipos" class="btn btn-secondary" onclick="handleCancelEditPostTipo(event); return false;">
      <i class="fa-solid fa-arrow-left"></i> Volver a Tipos de Publicación
    </a>
  </div>
  <div class="modal-card" style="max-width: 700px; margin: 0 auto; box-shadow: var(--shadow-md);">
    <div class="modal-header">
      <h2><i class="fa-solid fa-pen-to-square" style="color:var(--accent-emerald);"></i> Editar Tipo de Publicación</h2>
    </div>
    <div class="modal-body">
      <form id="editPostTipoForm" onsubmit="handleSaveEditPostTipo(event)">
        <input type="hidden" id="editPostTipoId">
        <div class="form-group">
          <label class="form-label" for="editPostTipoNombre"><i class="fa-solid fa-pen"></i> Nombre del Tipo</label>
          <input type="text" id="editPostTipoNombre" class="form-control" placeholder="Nombre..." required>
        </div>
        <div class="form-group">
          <label class="form-label" for="editPostTipoDesc"><i class="fa-solid fa-align-left"></i> Descripción</label>
          <textarea id="editPostTipoDesc" rows="3" class="form-control" placeholder="Descripción..."></textarea>
        </div>
        <div class="form-group">
          <label class="form-label" for="editPostTipoRolId"><i class="fa-solid fa-user-shield"></i> Rol Asignado</label>
          <select id="editPostTipoRolId" class="form-control">
            <option value="">-- Todos los Roles / Ninguno --</option>
          </select>
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:1.5rem;">
          <button type="button" class="btn btn-danger" onclick="handleDeleteTipoFromForm()">
            <i class="fa-solid fa-trash-can"></i> Eliminar
          </button>
          <div style="display:flex; gap:1rem;">
            <button type="button" class="btn btn-secondary" onclick="handleCancelEditPostTipo(event)">Cancelar</button>
            <button type="submit" class="btn btn-primary" id="btnSubmitEditPostTipo">
              <i class="fa-solid fa-floppy-disk"></i> Guardar Cambios
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
